"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[ui]
editor = "nvim"
paginate = "never"
default-command = "log"
diff-formatter = ":git"
diff-editor = ":builtin"

[git]
push-bookmark-prefix = "cparrish/"
abandon-unreachable-commits = true

[remotes.origin]
auto-track-bookmarks = "*"

[signing]
behavior = "own"
